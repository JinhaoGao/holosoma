[mypy]
python_version = 3.11
files =
    src/holosoma_retargeting/holosoma_retargeting/config_types/__init__.py,
    src/holosoma_retargeting/holosoma_retargeting/config_types/retargeter.py,
    src/holosoma_retargeting/holosoma_retargeting/config_types/retargeting.py,
    src/holosoma_retargeting/holosoma_retargeting/config_types/robot.py,
    src/holosoma_retargeting/holosoma_retargeting/config_types/robot_profiles.py,
    src/holosoma_retargeting/holosoma_retargeting/retargeting_pipeline.py,
    src/holosoma_retargeting/holosoma_retargeting/shoulder_direction.py,
    src/holosoma_retargeting/holosoma_retargeting/src/interaction_mesh_retargeter.py,
    src/holosoma_retargeting/holosoma_retargeting/visualization/shoulder_direction.py,
    tests/test_e1_retargeting_config.py,
    tests/test_nature_regularization.py,
    tests/test_retargeting_entrypoints.py,
    tests/test_root_stability_objective.py,
    tests/test_shoulder_direction.py,
    tests/test_shoulder_direction_visualization.py
plugins = pydantic.mypy
follow_imports = skip
ignore_missing_imports = True
warn_redundant_casts = True

# NumPy's generic ndarray constructors require extensive local annotations in
# the legacy solver. Keep semantic type errors enabled while suppressing that
# annotation-only noise for this incremental Python 3.11 checking boundary.
disable_error_code = var-annotated
